[project]
name = "gfslib"
version = "0.4.0"
packages = [{ include = "gfslib", from = "src" }]
description = "Python library for communication to the GeMMA Fusion Server"
authors = [
    {name = "Mitko Nikov",email = "mitko.nikov@um.si"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests (>=2.32.5,<3.0.0)"
]
dynamic = [ "classifiers" ]

[project.urls]
homepage = "https://github.com/mitkonikov/gfslib"
repository = "https://github.com/mitkonikov/gfslib"
documentation = "https://github.com/mitkonikov/gfslib"
"Bug Tracker" = "https://github.com/mitkonikov/gfslib/issues"

[tool.poetry]
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[tool.poetry.group.dev.dependencies]
mypy = "^2.4.0"
black = "^26.10.1"
pytest = "^9.1.1"
types-requests = "^2.33.0.20261006"
python-dotenv = "^1.2.4"
pytest-cov = "^7.1.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.7"
mkdocstrings = {version = "^0.30.0", extras = ["python"]}
mkdocs-gen-files = "^0.6.1"
mkdocs-literate-nav = "^0.6.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
branch = true
source = ["gfslib"]

[tool.coverage.report]
fail_under = 100
show_missing = true
